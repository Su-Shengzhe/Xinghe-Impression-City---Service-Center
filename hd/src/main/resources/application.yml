spring:
  config:
    import:
      - optional:file:./.env[.properties]
      - optional:file:../.env[.properties]
  sql:
    init:
      # Flyway is the sole schema owner. schema.sql remains only as a historical reference.
      mode: never
  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    baseline-on-migrate: ${SPRING_FLYWAY_BASELINE_ON_MIGRATE:true}
    baseline-version: 1
  application:
    name: xinghe-trade-center
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:xinghe_trade}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
    elasticsearch:
      repositories:
        enabled: ${XINGHE_ELASTICSEARCH_ENABLED:false}
  session:
    store-type: redis
    timeout: ${SPRING_SESSION_TIMEOUT:30m}
    redis:
      namespace: ${SPRING_SESSION_REDIS_NAMESPACE:xinghe:session}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${SPRING_RABBITMQ_VIRTUAL_HOST:/}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        default-requeue-rejected: false
  elasticsearch:
    uris: ${ELASTICSEARCH_URI:http://localhost:9200}
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
server:
  port: ${SERVER_PORT:8081}
management:
  health:
    rabbit:
      enabled: ${XINGHE_MESSAGING_ENABLED:false}
    elasticsearch:
      enabled: ${XINGHE_ELASTICSEARCH_ENABLED:false}
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
xinghe:
  order:
    expiry-scan-ms: ${XINGHE_ORDER_EXPIRY_SCAN_MS:30000}
  auth:
    employee-seed:
      enabled: ${XINGHE_AUTH_EMPLOYEE_SEED_ENABLED:false}
      username: ${XINGHE_AUTH_EMPLOYEE_SEED_USERNAME:}
      password: ${XINGHE_AUTH_EMPLOYEE_SEED_PASSWORD:}
      store-id: ${XINGHE_AUTH_EMPLOYEE_SEED_STORE_ID:0}
  seed:
    enabled: ${XINGHE_SEED_ENABLED:false}
  messaging:
    enabled: ${XINGHE_MESSAGING_ENABLED:false}
    outbox-poll-ms: ${XINGHE_OUTBOX_POLL_MS:1000}
  search:
    rebuild-api-enabled: ${XINGHE_INDEX_REBUILD_API_ENABLED:false}
    elasticsearch:
      enabled: ${XINGHE_ELASTICSEARCH_ENABLED:false}
  customer-service:
    agent:
      enabled: ${XINGHE_AGENT_ENABLED:false}
      api-key: ${XINGHE_AGENT_API_KEY:}
      base-url: ${XINGHE_AGENT_BASE_URL:https://api.openai.com/v1}
      model: ${XINGHE_AGENT_MODEL:gpt-4o-mini}
      timeout: ${XINGHE_AGENT_TIMEOUT:8s}
